{% extends 'base.html' %}

{% block contenido %}
<h1>Iniciar sesión</h1>

{% if form.errors %}
    <p>El usuario o la contraseña no son correctos.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Ingresar</button>
</form>
{% endblock %}
